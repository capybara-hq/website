name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels its older run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No default token permissions: each job asks for what it needs.
permissions: {}

# Branch protection requires `ci-ok` (which aggregates every job below) and `issue-linked`
# (set by community.yml, not part of this workflow). The site is small: everything runs on every
# PR and every push to main. Until the site is scaffolded, `build` only checks out the tree.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the site when it exists
        run: |
          if [ ! -f package.json ]; then echo "No site yet"; exit 0; fi
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

  ci-ok:
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do [ "$r" = success ] || { echo "a job ended with $r"; exit 1; }; done
